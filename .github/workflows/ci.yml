# Service layer CI. Upstream's own suites (golden, validator, extraction,
# fuzz) stay in tests.yml untouched so upstream merges don't conflict.
name: service

on:
  push:
  pull_request:

jobs:
  service-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Upstream engine must be unmodified
        # Fails if anyone edits the vendored engine in place instead of
        # contributing upstream. Bump UPSTREAM_SHA when merging upstream.
        env:
          UPSTREAM_SHA: 3c1c49af466dba157182515bb5e8d3a4392b433b
        run: |
          git fetch --no-tags https://github.com/karanb192/itr-wala.git "$UPSTREAM_SHA"
          git diff --exit-code "$UPSTREAM_SHA" -- skills/itr-wala/scripts \
            || (echo "::error::skills/itr-wala/scripts differs from upstream $UPSTREAM_SHA"; exit 1)
      - name: Schema conformance is mandatory once schemas are vendored
        run: |
          if [ -f service/schema/AY2026-27/sources.json ]; then
            echo "REQUIRE_SCHEMAS=1" >> "$GITHUB_ENV"
          fi
      - name: Service tests (builder goldens, rejections, schema, HTTP contract)
        run: python -m pytest -q
      - name: Export OpenAPI spec (consumed by itr-assist codegen)
        run: |
          python -c "import json; from service.app import app; print(json.dumps(app.openapi(), indent=2))" > openapi.json
      - uses: actions/upload-artifact@v4
        if: matrix.python-version == '3.12'
        with:
          name: openapi
          path: openapi.json

  docker:
    runs-on: ubuntu-latest
    needs: service-tests
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t itr-wala-service .
      - name: Smoke test
        run: |
          docker run -d -p 8000:8000 --name svc itr-wala-service
          for i in $(seq 1 20); do curl -fsS localhost:8000/health && exit 0; sleep 1; done
          docker logs svc; exit 1
